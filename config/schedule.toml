# Sailing timetable for the Saltery Bay – Earls Cove route.
#
# ⚠️  THIS FILE IS WHAT GETS DEPLOYED. The times below are copied from the published
#     BC Ferries timetable for Route 7, but they cover the summer range only — the
#     schedule goes empty on Oct 13 2026 (see the foot of this file). Re-check them
#     whenever BC Ferries changes the timetable, and never add a time you have not
#     confirmed: a wrong departure silently mis-windows every observation around it, the
#     collector runs happily and records the wrong thing, and correcting the times later
#     does not repair sailings already aggregated against them.
#
# The schedule is seasonal, so it is expressed as dated blocks. Add a new block whenever
# BC Ferries changes the timetable; blocks may overlap in date as long as they cover
# different days of the week.
#
# Fields:
#   terminal       terminal code the sailing departs FROM
#   effective_from / effective_to   inclusive date range this block applies to
#   days           "all", or a list from mon tue wed thu fri sat sun
#   departures     local wall-clock HH:MM times
#   route          optional. Omit it while there is one route (as below). Once this file
#                  covers more than one, set it on every block; blocks naming a different
#                  route are ignored rather than mixed in.

# VERIFIED — from the published bcferries.com timetable, "Powell River (Saltery Bay) to
# Sunshine Coast (Earls Cove)", effective May 14 – Oct 12 2026. Mon and Fri were checked
# departure by departure against that timetable and are identical; the maintainer confirms
# the timetable is the same every day of the week, hence `days = "all"`.
[[block]]
terminal       = "SLT"
effective_from = 2026-05-14
effective_to   = 2026-10-12
days           = "all"
departures     = ["05:35", "07:25", "09:25", "11:45", "14:30", "16:55", "19:05", "21:00"]

# VERIFIED — same source and date range, "Sunshine Coast (Earls Cove) to Powell River
# (Saltery Bay)", and likewise the same every day of the week. Friday is identical to
# Monday, checked departure by departure: this route adds no extra Friday sailings in this
# direction, which is the opposite of what the peak-season assumption would have
# predicted. One block, not two — and, with a uniform week, not seven.
[[block]]
terminal       = "ERL"
effective_from = 2026-05-14
effective_to   = 2026-10-12
days           = "all"
departures     = ["06:30", "08:20", "10:35", "12:55", "15:40", "18:00", "20:05", "22:00"]

# The two directions above interleave as one vessel making eight round trips: every SLT
# arrival is followed by an ERL departure 5–20 minutes later, and vice versa, with no
# overlap and no gap big enough to hide a sailing. That closure is a useful check — a
# mistyped or omitted time would break the chain.

# ────────────────────────────────────────────────────────────────────────────────────────
# STILL MISSING: the off-season timetable, Oct 13 2026 – May 13 2027. The blocks above
# cover only the summer range, so the schedule goes empty on Oct 13 until it is added. Add
# it as its own [[block]], matching the form above.
#
# Do not assume the off-season week is uniform just because the summer one is. Get the
# published times. A departure time that is merely plausible mis-windows every observation
# around it, silently: the collector runs happily and records the wrong thing, and
# correcting the times later does not repair sailings already aggregated against them.
#
# Keep preferring wider `days` lists over duplicated blocks: same times in one place, not
# seven copies to keep in sync.
# ────────────────────────────────────────────────────────────────────────────────────────
