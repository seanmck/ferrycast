# STILL MISSING: Apr 1 2027 onwards. The blocks above stop where the published feed
# stops, so the schedule goes empty on Apr 1 2027 until the next timetable is added —
# and when it is empty the site says "no sailings scheduled", takes no reports, and the
# board scraper records every fetch as `unparsed`. Add the next range as its own
# [[block]]s, matching the form above.
#
# Do not assume the next range is uniform or repeats this one. Get the published times.
# A departure time that is merely plausible mis-windows every observation around it,
# silently: the collector runs happily and records the wrong thing, and correcting the
# times later does not repair sailings already aggregated against them.
#
# Keep preferring wider `days` lists over duplicated blocks: same times in one place, not
