# FerryCast configuration — the live one. This file is committed (force-added past
# .gitignore) because the Docker image needs it. It holds no secrets: the API key is the
# ANTHROPIC_API_KEY environment variable.
#
# ⚠️  webcam_url points at BC Ferries' terminal cameras, which publish a still JPEG per
#     terminal under ccimg.bcferries.com/cc/support/terminals/. There is NO reliable pattern:
#     Saltery Bay is cam1_SLT.jpg and Earls Cove is cam2_erl.jpg — a different camera number
#     AND a different case. Deriving one terminal's URL from another's is what left Earls
#     Cove failing every capture for its first day while every other signal looked fine.
#     Both of these were supplied by hand. Add any new terminal's URL the same way, and run
#     `ferrycast doctor`, which reports whether each one actually returns an image.
#
#     Still to satisfy yourself about: that the address stays fixed rather than acquiring an
#     expiring token, and that low-rate archival is acceptable use.
#
#     Blank is safe: deck-space scraping is the history source and needs no camera. Only
#     `ferrycast check` requires one. You can supply them here or, to keep them out of git,
#     as FERRYCAST_WEBCAM_SLT / FERRYCAST_WEBCAM_ERL environment variables.
#
# ⚠️  user_agent below still says you@example.com. It is sent to BC Ferries on every
#     scrape as your contact address — put a real one there.

[app]
timezone       = "America/Vancouver"
# Left relative so local runs write to ./data. In the container FERRYCAST_DATA_DIR=/data
# takes precedence over this line, so the same file works in both places — do not hardcode
# /data here or local runs will try to write to the volume path.
data_dir       = "../data"          # relative to this file
db_name        = "ferrycast.db"
frames_dirname = "frames"
schedule_path  = "schedule.toml"    # relative to this file

# v1 tracks one route. If you ever define more than one below, name the active one here:
# active_route = "route7"

# One route, defined as a single [route] table. Adding a second route later is a config
# edit, not a format change: switch these to the [[route]] array form (double brackets),
# append another, and set active_route above. Everything downstream is already keyed by
# route id — see "Adding a route later" in the README.
[route]
id   = "route7"
name = "Saltery Bay – Earls Cove"

# BC Ferries' live vessel tracker for this route. It is the ONLY source of a departure time
# for Earls Cove, which publishes no departures board at all — the route's conditions page
# for that direction carries a ferry-tracking tab and nothing else. Both directions embed
# this same page, so one URL covers the route.
#
# It sees the ship and never the deck or the compound: it can say a sailing went and roughly
# when, and nothing about whether it filled or left anyone behind. Blank is safe — the
# tracker is simply not polled.
vessel_tracking_url = "https://ccimg.bcferries.com/cc/support/vessels/route29.html"

  [[route.terminals]]
  code           = "SLT"
  name           = "Saltery Bay"
  destination    = "ERL"
  # Which way the vessel points once it has left here. Saltery Bay lies west-northwest of
  # Earls Cove, so a ship leaving Saltery Bay runs east. This is what lets the vessel tracker
  # tell the two directions apart: it reports the vessel as stopped without ever naming where,
  # heading once moving is the only thing that says which terminal was just left. Leave it
  # blank and no departure is inferred from tracking for this terminal.
  outbound_bearing = "E"
  webcam_url     = "https://ccimg.bcferries.com/cc/support/terminals/cam1_SLT.jpg"
  deck_space_url = "https://www.bcferries.com/current-conditions/SLT-ERL"
  # Set true ONLY if this camera actually shows the berth — look at a frame first. When
  # false, frames still count the queue; they just cannot say whether a sailing ran.
  camera_sees_berth = false
  # The weather ashore, at the compound. ECCC forecasts this stretch of coast as
  # "Sunshine Coast - Saltery Bay to Powell River", which names the terminal outright.
  weather_site     = "s0000634"
  weather_province = "BC"


  [[route.terminals]]
  code           = "ERL"
  name           = "Earls Cove"
  destination    = "SLT"
  # Leaving Earls Cove the crossing runs west-northwest toward Saltery Bay. This terminal has
  # no departures board of any kind, so tracking is its only source of a departure time.
  outbound_bearing = "W"
  # cam2, lowercase. Not cam1_ERL.jpg — that was inferred from Saltery Bay and 404s.
  webcam_url     = "https://ccimg.bcferries.com/cc/support/terminals/cam2_erl.jpg"
  deck_space_url = "https://www.bcferries.com/current-conditions/ERL-SLT"
  # This camera looks up the approach road, not at the berth — it never shows a vessel, so
  # frames from it can neither time a departure nor evidence a cancellation. Leave false.
  camera_sees_berth = false
  # The far end gets its own forecast: Gibsons' covers "Sunshine Coast - Gibsons to Earls
  # Cove". Sechelt (s0000317) is the same region and would do as well.
  weather_site     = "s0000316"
  weather_province = "BC"


  # The ECCC marine forecast for the water this crossing makes. Wind is the one condition
  # that cancels a sailing outright, and the only one FerryCast does not observe for itself.
  #
  # m0000028 is "Strait of Georgia", which ECCC forecasts in two halves split at Nanaimo.
  # Saltery Bay – Earls Cove is entirely in the north half, and without `location` the
  # parser would take whichever came first and answer about the wrong end of the strait.
  [route.marine]
  site     = "m0000028"
  domain   = "pacific"
  location = "Strait of Georgia - north of Nanaimo"


[capture]
# Every 5 minutes. The old value of 15 was rationing paid vision calls; frames are now read
# by geometry at ~19ms each, so cost no longer sets this and courtesy does. The camera
# publishes a new JPEG once a minute, so this takes one frame in five of what it already
# generates — 576 requests and ~9MB a day across both terminals.
interval_minutes = 5
timeout_seconds  = 20.0
max_retries      = 2
# Identify yourself honestly, and leave a way to be contacted.
user_agent = "ferrycast/0.1 (personal ferry-wait archive; contact: you@example.com)"

[vision]
# Haiku cannot read these cameras. Over 38 frames of a bare, floodlit compound it never
# once returned "empty", and reported a flat "light" across an entire empty night. Sonnet
# called all 15 genuinely empty frames empty and landed within one band on all 39.
model               = "claude-sonnet-5"
prompt_version      = "v2"    # bump to re-extract the backlog with an improved prompt
max_frames_per_run  = 200
max_image_width     = 896     # image tokens scale with area — this is the main cost lever
monthly_budget_usd  = 5.0     # extraction stops when the month's spend reaches this
input_usd_per_mtok  = 3.0     # Claude Sonnet 5 list price, for cost accounting
output_usd_per_mtok = 15.0
min_confidence      = 0.35    # below this, the frame is flagged rather than trusted
skip_dark_frames    = true    # night frames are marked unusable without spending a call
dark_luma_threshold = 24.0

# Which frames `ferrycast extract --essential` pays to read, in minutes relative to a
# scheduled departure (negative = before it). The outcome depends on the queue shortly
# before departure and what remained once the vessel had gone — not on every frame in the
# window. Four offsets roughly halves the cost of building history. Widen for a richer
# arrival curve, narrow to save more.
essential_offsets_minutes  = [-30, -10, 15, 30]
essential_tolerance_minutes = 10

# `ferrycast check` — the on-demand path. How many recent frames one check may read, and
# how old a frame may be and still count as "now".
on_demand_max_frames     = 3
on_demand_max_age_minutes = 90

[web]
# An HTTP request that spends money deserves a guard, even on a household LAN. Turn this
# on to enable POST /api/check. Even when on, a terminal with a lane calibration
# (config/calibration/<CODE>.json) refuses the request — it already gets a free
# geometry-based reading on every capture, so there is nothing to buy.
allow_on_demand_checks = false
on_demand_daily_cap    = 40   # maximum frames the web path may read in a day
allow_on_demand_backfill = false  # the "fill this slot's history" button; spends money
backfill_daily_frame_cap = 120

[aggregate]
# Malaspina Sky (BC Ferries code ISKY, built 2008) — the same vessel formerly named
# Island Sky, renamed rather than replaced, so 125 was right all along. This number is the
# waited_1 / waited_2plus boundary: a residual queue larger than the vessel means more than
# one sailing's worth was left behind. Re-check it if the route ever changes ship.
vessel_capacity         = 125  # approx. vehicle equivalents
lookback_minutes        = 120  # how far before a departure to look for queue build-up
departure_grace_minutes = 20   # "queue at departure" comes from this window before it
settle_minutes          = 12   # wait this long after departure before reading the residual
post_window_minutes     = 45
residual_threshold      = 5    # a residual at or above this means vehicles were left behind

[query]
min_sample                     = 5   # below this, the search widens and says so
max_samples                    = 5   # only the most recent N comparable sailings count
time_tolerance_minutes         = 15
relaxed_time_tolerance_minutes = 60

[retention]
keep_frames_days        = 400  # a full season plus margin, per R1
downsample_after_days   = 120
downsample_keep_per_hour = 1
# With extraction deferred, an unread frame is the only record of that moment — so pruning
# leaves it alone by default. Set false to reclaim the disk and accept the permanent gap.
keep_unextracted        = true
