[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrycast"
version = "0.1.0"
description = "Historical wait tracker for the Saltery Bay <-> Earls Cove ferry route"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sean" }]
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ferrycast = "ferrycast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ferrycast = ["schema.sql", "web/templates/*.html", "web/static/fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is expressed as `Depends(...)` in argument defaults.
"src/ferrycast/web/app.py" = ["B008"]
